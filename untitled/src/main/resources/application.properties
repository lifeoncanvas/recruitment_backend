# ===================================================================
# LICHT Recruitment Services - Secure Spring Boot Configuration
# ===================================================================
server.port=${PORT:8080}

# Load secrets from a private .env file in the folder the app is started from (never committed).
# Real environment variables still take priority over values in this file.
spring.config.import=optional:file:.env[.properties]

# -------------------------------------------------------------------
# PostgreSQL Database Connection Settings
# Sensitive credentials are supplied via environment variables
# DO NOT commit real secrets or production passwords into this file!
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/licht_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP settings optimized for Connection Pools & Auto-Reconnect
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# File Upload Limits (for CV documents, up to 10MB)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Application Security & Token Settings
# Supply via environment variables in production
# -------------------------------------------------------------------
# No defaults on purpose: the app refuses to start if ADMIN_PASSWORD or JWT_SECRET is missing.
app.security.admin.email=${ADMIN_EMAIL:admin@lichtrecruitmentservices.com}
app.security.admin.password=${ADMIN_PASSWORD:}
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=86400000

# Only trust X-Forwarded-For when deployed behind a known reverse proxy / load balancer
app.security.trust-proxy=${TRUST_PROXY:false}

# Create demo candidate/employer logins on an empty database (local development only)
app.seed.demo-accounts=${SEED_DEMO_ACCOUNTS:false}

# Where uploaded CVs and employer documents are kept: "local" (server disk) or "s3"
# Use s3 on hosts that wipe the disk on redeploy (Render, Railway, Heroku, containers)
app.storage.type=${STORAGE_TYPE:local}

# local: directory where files are stored (not publicly served)
app.storage.upload-dir=${UPLOAD_DIR:uploads}

# s3: a PRIVATE bucket on AWS S3, Cloudflare R2, Backblaze B2 or MinIO.
# S3_ENDPOINT is only needed for non-AWS providers, e.g. https://<account-id>.r2.cloudflarestorage.com
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.access-key=${S3_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${S3_SECRET_ACCESS_KEY:}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lichtrecruitmentservices.com,https://www.lichtrecruitmentservices.com}

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.licht=INFO
logging.level.org.springframework.web=WARN
